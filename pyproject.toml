[project]
name = "lyrics-lint"
version = "0.1.0"
description = "Lyrics rhyme/slant-rhyme linter with CLI and MCP server"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "fastmcp>=2.0",
]

[project.scripts]
lyrics = "lyrics_lint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ISC"]
# SIM905: a multi-line word block reads better than a 150-element list literal.
ignore = ["SIM905"]
